# Automatic app placement
[[on-window-detected]]
if.app-id = 'com.microsoft.to-do-mac'
run = "move-node-to-workspace '6📋▶'"

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'layout floating'

# Monitor assignments
[workspace-to-monitor-force-assignment]
"1◀" = '^built-in retina display$'
"2◀" = '^built-in retina display$'
"3◀" = '^built-in retina display$'
"4◀" = '^built-in retina display$'
"5◀" = '^built-in retina display$'
"6📋◀" = '^built-in retina display$'
"7☕◀" = '^built-in retina display$'

"1▶" = '2'
"2▶" = '2'
"3▶" = '2'
"4▶" = '2'
"5▶" = '2'
"6📋▶" = '2'
"7☕▶" = '2'
