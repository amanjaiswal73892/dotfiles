# Minimal AeroSpace config
#
# QUICK GUIDE
# Hyper = Right Command (Ctrl+Option+Command through Raycast; Shift is separate)
#
# 1. NAVIGATE — Hyper takes you somewhere
#    Hyper+1..5       Open that project on both monitors; finish on primary
#    Hyper+6 / 7      Open Plan 📋 / Chill ☕ on both monitors
#    Hyper+A..Z       Focus/cycle an open app; sync its project on both monitors
#    Hyper+←/→        Cycle both monitors together (also used by mouse gestures)
#
# 2. SEND — Hyper+Shift sends the selected window somewhere
#    Hyper+Shift+1..7 Send it to that workspace; you stay where you are
#
# 3. ARRANGE — Ctrl+Option changes the selected window here
#    Ctrl+Option+←/→  Tile horizontally and move; cross monitors at the edge
#    Ctrl+Option+↑/↓  Tile vertically and move
#    Ctrl+Option+Enter Toggle fullscreen

config-version = 2
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Reusable one-file helper for Hyper+letter application focus.
# It never launches apps. For workspaces 1..7, it also shows the matching
# left/right workspace pair before finishing on the selected app window.
[exec.env-vars]
# Make the AeroSpace CLI available to commands launched by AeroSpace.app.
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:${PATH}'
FOCUS_APP_BY_LETTER = '''
letter="$1"
focused="$(aerospace list-windows --focused --format '%{window-id}' 2>/dev/null || true)"
selection="$(
    aerospace list-windows --all --format '%{window-id}%{tab}%{app-name}%{tab}%{workspace}' |
    awk -F '\t' -v letter="$letter" -v focused="$focused" '
        {
            name = tolower($2)
            sub(/^(microsoft|google|the)[[:space:]]+/, "", name)
        }
        substr(name, 1, 1) == tolower(letter) {
            ids[++count] = $1
            workspaces[count] = $3
            if ($1 == focused) current = count
        }
        END {
            if (count == 0) exit
            targetIndex = current ? (current % count) + 1 : 1
            print ids[targetIndex] "\t" workspaces[targetIndex]
        }
    '
)"
[ -z "$selection" ] && exit 0

IFS=$'\t' read -r target workspace <<< "$selection"
companion=''

case "$workspace" in
    [1-7]*▶)
        stem="$(printf '%s' "$workspace" | sed 's/▶$//')"
        printf -v companion '%s◀' "$stem"
        ;;
    [1-7]*◀)
        stem="$(printf '%s' "$workspace" | sed 's/◀$//')"
        printf -v companion '%s▶' "$stem"
        ;;
esac

[ -n "$companion" ] && aerospace workspace "$companion"
aerospace focus --window-id "$target"
'''

# Cycle the numbered workspace pair and finish on the monitor under the mouse.
CYCLE_WORKSPACE_PAIR = '''
direction="$1"
current="$(aerospace list-workspaces --monitor mouse --visible | head -n 1)"

case "$current" in
    1*) number=1 ;;
    2*) number=2 ;;
    3*) number=3 ;;
    4*) number=4 ;;
    5*) number=5 ;;
    6*) number=6 ;;
    7*) number=7 ;;
    *) exit 0 ;;
esac

if [ "$direction" = next ]; then
    number=$((number % 7 + 1))
else
    number=$(((number + 5) % 7 + 1))
fi

case "$number" in
    6) stem='6📋' ;;
    7) stem='7☕' ;;
    *) stem="$number" ;;
esac

case "$current" in
    *◀)
        aerospace workspace "$stem▶"
        aerospace workspace "$stem◀"
        ;;
    *)
        aerospace workspace "$stem◀"
        aerospace workspace "$stem▶"
        ;;
esac
'''

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Main mode
# Ctrl+Option: manipulate the selected window.
# Hyper: navigate workspaces and applications.
[mode.main.binding]
ctrl-alt-left = [
    'fullscreen off',
    'layout tiles horizontal',
    'move left --boundaries workspace --boundaries-action fail || move-node-to-monitor --focus-follows-window --wrap-around prev',
]
ctrl-alt-right = [
    'fullscreen off',
    'layout tiles horizontal',
    'move right --boundaries workspace --boundaries-action fail || move-node-to-monitor --focus-follows-window --wrap-around next',
]
ctrl-alt-up = ['fullscreen off', 'layout tiles vertical', 'move up']
ctrl-alt-down = ['fullscreen off', 'layout tiles vertical', 'move down']
ctrl-alt-enter = 'fullscreen'

# Hyper+Left/Right cycles the paired workspaces on both displays.
# It returns focus to the display under the mouse. These bindings are also
# targets for the MX Master 3 thumb gestures.
ctrl-alt-cmd-left = '''exec-and-forget /bin/bash -c "$CYCLE_WORKSPACE_PAIR" -- prev'''
ctrl-alt-cmd-right = '''exec-and-forget /bin/bash -c "$CYCLE_WORKSPACE_PAIR" -- next'''

# Hyper-number switches workspaces directly.
ctrl-alt-cmd-1 = ["workspace '1◀'", "workspace '1▶'"]
ctrl-alt-cmd-2 = ["workspace '2◀'", "workspace '2▶'"]
ctrl-alt-cmd-3 = ["workspace '3◀'", "workspace '3▶'"]
ctrl-alt-cmd-4 = ["workspace '4◀'", "workspace '4▶'"]
ctrl-alt-cmd-5 = ["workspace '5◀'", "workspace '5▶'"]
ctrl-alt-cmd-6 = ["workspace '6📋◀'", "workspace '6📋▶'"]
ctrl-alt-cmd-7 = ["workspace '7☕◀'", "workspace '7☕▶'"]

# Hyper+Shift-number sends the selected window directly.
# Numbered workspaces use the primary monitor (▶).
ctrl-alt-cmd-shift-1 = "move-node-to-workspace '1▶'"
ctrl-alt-cmd-shift-2 = "move-node-to-workspace '2▶'"
ctrl-alt-cmd-shift-3 = "move-node-to-workspace '3▶'"
ctrl-alt-cmd-shift-4 = "move-node-to-workspace '4▶'"
ctrl-alt-cmd-shift-5 = "move-node-to-workspace '5▶'"
ctrl-alt-cmd-shift-6 = "move-node-to-workspace '6📋▶'"
ctrl-alt-cmd-shift-7 = "move-node-to-workspace '7☕▶'"

# Hyper+letter cycles already-open windows by application initial.
# Common vendor prefixes such as "Microsoft", "Google", and "The" are ignored.
ctrl-alt-cmd-a = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- a'''
ctrl-alt-cmd-b = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- b'''
ctrl-alt-cmd-c = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- c'''
ctrl-alt-cmd-d = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- d'''
ctrl-alt-cmd-e = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- e'''
ctrl-alt-cmd-f = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- f'''
ctrl-alt-cmd-g = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- g'''
ctrl-alt-cmd-h = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- h'''
ctrl-alt-cmd-i = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- i'''
ctrl-alt-cmd-j = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- j'''
