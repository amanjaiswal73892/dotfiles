ctrl-alt-cmd-m = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- m'''
ctrl-alt-cmd-n = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- n'''
ctrl-alt-cmd-o = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- o'''
ctrl-alt-cmd-p = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- p'''
ctrl-alt-cmd-q = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- q'''
ctrl-alt-cmd-r = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- r'''
ctrl-alt-cmd-s = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- s'''
ctrl-alt-cmd-t = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- t'''
ctrl-alt-cmd-u = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- u'''
ctrl-alt-cmd-v = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- v'''
ctrl-alt-cmd-w = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- w'''
ctrl-alt-cmd-x = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- x'''
ctrl-alt-cmd-y = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- y'''
ctrl-alt-cmd-z = '''exec-and-forget /bin/bash -c "$FOCUS_APP_BY_LETTER" -- z'''

